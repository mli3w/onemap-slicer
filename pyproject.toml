[project]
name = "onemap-slicer"
version = "0.1.0"
description = "Extract 3D building models from OneMap Singapore for 3D printing"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Aniruddha" }
]
keywords = ["3d-printing", "onemap", "singapore", "buildings", "3mf", "stl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "trimesh[easy]>=4.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "lxml>=4.9.0",
    "pymeshfix>=0.16.0",
    "platformdirs>=3.0.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
]

[project.scripts]
onemap-slicer = "onemap_slicer.cli:main"

[project.urls]
Homepage = "https://github.com/aniruddha/onemap-slicer"
Repository = "https://github.com/aniruddha/onemap-slicer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onemap_slicer"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM105", # contextlib.suppress - try/except/pass is clearer for repair sequences
]

[tool.ruff.format]
quote-style = "double"
